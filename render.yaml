services:
  - type: web
    name: engine-intelligence
    runtime: python
    # PyTorch + YOLO + two classifiers will not fit the 512 MB starter tier; change the plan if you must.
    plan: standard
    buildCommand: pip install -r requirements.txt && pip uninstall -y opencv-python && pip install --force-reinstall --no-deps opencv-python-headless && cd frontend && npm ci && npm run build
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Low-memory settings: CPU inference, one thread pool, less glibc fragmentation, one inference at a time.
      - key: TORCH_DEVICE
        value: cpu
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MAX_CONCURRENT_INFERENCES
        value: "1"
      # Secrets: values are entered in the Render dashboard, never stored in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_BACKUP
        sync: false
